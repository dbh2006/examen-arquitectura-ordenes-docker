
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - ordenes_net
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: "0:0"
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./db/init.sql:/scripts/init.sql:ro
      - ./db/init-db.sh:/scripts/init-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ordenes_net
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ordenes-api:v1.0
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: OrdenesDB
      DB_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - ordenes_net
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ordenes-web:v1.0
    environment:
      API_URL: http://api:5000
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ordenes_net
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  sql_data:

networks:
  ordenes_net:
    driver: bridge
